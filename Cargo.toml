[package]
name = "j8"
description = "j8: V8 rewritten in Rust. The root package re-exports the binding macros #[j8::class] / #[j8::object] / #[j8::function] and the traits and types they need"
version.workspace = true
edition.workspace = true
license.workspace = true
# tests/test262.rs belongs to the dune package; only binding is registered here
autotests = false
repository.workspace = true
readme = "README.md"
# 只发库本身：tests/test262 子模块有五万多个文件，crates.io 收不下
include = ["/src", "/tests/binding.rs", "/README.md", "/README.zh-CN.md", "/LICENSE"]

[lib]
name = "j8"
path = "src/lib.rs"

[dependencies]
j8framework.workspace = true
j8binding.workspace = true
j8macros.workspace = true

[dev-dependencies]
j8executor.workspace = true
j8builtins.workspace = true
j8platform.workspace = true

[[test]]
name = "binding"
path = "tests/binding.rs"

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["crates/*", "samples/*", "debugger"]
# The V8 comparison benchmark downloads rusty_v8's prebuilt library, so it is a workspace of its own
exclude = ["samples/benchv8"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/0x00-Community/j8"

[workspace.dependencies]
j8framework = { version = "0.1.2", path = "crates/j8framework" }
j8platform = { version = "0.1.2", path = "crates/j8platform" }
j8builtins = { version = "0.1.2", path = "crates/j8builtins" }
j8virtasm = { version = "0.1.2", path = "crates/j8virtasm", default-features = false }
j8executor = { version = "0.1.2", path = "crates/j8executor" }
j8compiler = { version = "0.1.2", path = "crates/j8compiler" }
j8jit = { version = "0.1.2", path = "crates/j8jit" }
mlirpass = { version = "=0.10.4", default-features = false, features = ["target.x86_64"] }
libc = "0.2"
j8macros = { version = "0.1.2", path = "crates/macros" }
j8binding = { version = "0.1.2", path = "crates/j8binding" }
j8 = { version = "0.1.2", path = "." }
clap = { version = "4.6", features = ["derive"] }
moremath = { version = "=0.2.3", default-features = false }
libm = "0.2"
paragc = "0.4.0"
j8lockfree = { version = "0.1.2", path = "crates/j8lockfree" }
smol_str = { version = "0.3", default-features = false }
hashbrown = { version = "0.17", default-features = false }
rustc-hash = { version = "2", default-features = false }
ryu-js = { version = "1", default-features = false }
num-bigint = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
regress = { version = "0.12", default-features = false, features = ["alloc", "utf16"] }
oxc_allocator = "0.158"
oxc_ast = "0.158"
oxc_parser = "0.158"
oxc_span = "0.158"
oxc_semantic = "0.158"
oxc_syntax = "0.158"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# JS numeric semantics are exact comparisons by definition
float_cmp = "allow"
# Short names like a / f / x / y are conventional in built-in functions
many_single_char_names = "allow"
# Paired names like args / argc are conventional
similar_names = "allow"
# When both branches have bodies, match reads better than if let ... else
single_match_else = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
