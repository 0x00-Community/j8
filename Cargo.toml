[package]
name = "r8"
description = "r8：Rust 重写的 V8。根包聚合导出：绑定宏 #[r8::class] / #[r8::object] / #[r8::function] 与它们要用的 trait、类型"
version.workspace = true
edition.workspace = true
license.workspace = true
# tests/ 下的 test262.rs 挂在 dune 包下，这里只认 binding
autotests = false

[dependencies]
r8framework.workspace = true
r8binding.workspace = true
r8macros.workspace = true

[dev-dependencies]
r8executor.workspace = true
r8builtins.workspace = true
r8platform.workspace = true

[[test]]
name = "binding"
path = "tests/binding.rs"

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["crates/*", "samples/*", "debugger"]
# 对比 V8 的基准要下载 rusty_v8 的预编译库，自成一个 workspace
exclude = ["samples/benchv8"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
r8framework = { path = "crates/r8framework" }
r8platform = { path = "crates/r8platform" }
r8builtins = { path = "crates/r8builtins" }
r8virtasm = { path = "crates/r8virtasm", default-features = false }
r8executor = { path = "crates/r8executor" }
r8compiler = { path = "crates/r8compiler" }
r8jit = { path = "crates/r8jit" }
mlirpass = { version = "=0.10.4", default-features = false, features = ["target.x86_64"] }
libc = "0.2"
r8macros = { path = "crates/macros" }
r8binding = { path = "crates/r8binding" }
r8 = { path = "." }
clap = { version = "4.6", features = ["derive"] }
moremath = { version = "=0.2.3", default-features = false }
libm = "0.2"
r8gc = { path = "crates/r8gc", default-features = false }
smol_str = { version = "0.3", default-features = false }
hashbrown = { version = "0.17", default-features = false }
rustc-hash = { version = "2", default-features = false }
ryu-js = { version = "1", default-features = false }
num-bigint = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
regress = { version = "0.12", default-features = false, features = ["alloc", "utf16"] }
oxc_allocator = "0.158"
oxc_ast = "0.158"
oxc_parser = "0.158"
oxc_span = "0.158"
oxc_semantic = "0.158"
oxc_syntax = "0.158"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# JS 数值语义本来就是精确比较
float_cmp = "allow"
# 内建函数里 a / f / x / y 这类短名是惯例
many_single_char_names = "allow"
# args / argc 这类成对的名字是惯例
similar_names = "allow"
# 两个分支都有内容时 match 比 if let ... else 好读
single_match_else = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
