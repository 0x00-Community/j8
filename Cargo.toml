[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
r8frame = { path = "crates/r8frame" }
r8platform = { path = "crates/r8platform" }
r8builtins = { path = "crates/r8builtins" }
r8bytecode = { path = "crates/r8bytecode", default-features = false }
r8executor = { path = "crates/r8executor" }
r8macros = { path = "crates/macros" }
clap = { version = "4.6", features = ["derive"] }
moremath = { version = "=0.2.2", default-features = false }
libm = "0.2"
gc-arena = { version = "0.7", default-features = false }
ryu-js = { version = "1", default-features = false }
oxc_allocator = "0.158"
oxc_ast = "0.158"
oxc_parser = "0.158"
oxc_span = "0.158"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# JS 数值语义本来就是精确比较
float_cmp = "allow"
# 内建函数里 a / f / x / y 这类短名是惯例
many_single_char_names = "allow"
# args / argc 这类成对的名字是惯例
similar_names = "allow"
# 两个分支都有内容时 match 比 if let ... else 好读
single_match_else = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
