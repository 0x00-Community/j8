[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
r8frame = { path = "crates/r8frame" }
r8platform = { path = "crates/r8platform" }
r8bytecode = { path = "crates/r8bytecode" }
mercedes = { path = "crates/mercedes" }
indexmap = "2"
ryu-js = "1"
oxc_allocator = "0.158"
oxc_ast = "0.158"
oxc_parser = "0.158"
oxc_span = "0.158"
oxc_syntax = "0.158"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
