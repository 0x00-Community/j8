[package]
# published as j8dune (the name dune is taken on crates.io); the library and the executable keep the name dune.
# There is one executable: dunx is a link to dune, which tells the two apart by the name it is started under
name = "j8dune"
description = "dune and dunx: a JavaScript runtime on j8 with a Node-compatible layer and a Web-standard layer, and a runner for npm packages' executables"
readme = "README.md"
version = "0.4.2"
edition = "2024"
license = "MIT"
# the npm packages are laid out from npm/ (see npm/pack.js), not shipped in the crate
exclude = ["npm", "tests"]
repository = "https://github.com/0x00-Community/j8"
keywords = ["javascript", "runtime", "node", "npm", "j8"]
categories = ["command-line-utilities", "development-tools"]

# dune is a package of its own, built against the published j8 (not part of the j8 workspace)
[workspace]

[lib]
name = "dune"
path = "src/lib.rs"

[[bin]]
name = "dune"
path = "src/main.rs"

[dependencies]
j8 = { version = "0.4.2", features = ["runtime", "json"] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
nodejs-semver = { version = "7", features = ["serde"] }
flate2 = "1.1.11"
tar = "0.4.46"
sha2 = "0.10"
base64 = "0.22"
ureq = { version = "3", features = ["json"] }
filetime = "0.2.30"
tempfile = "3.27.0"
faccess = "0.2.4"
fs4 = "1.1.0"
positioned-io = "0.3.5"
symlink = "0.1.0"
libc = "0.2"

[target.'cfg(all(unix, target_arch = "x86_64"))'.dependencies]
j8 = { version = "0.4.2", features = ["jit"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
# When both branches have bodies, match reads better than if let ... else
single_match_else = "allow"
# Bound functions receive their converted arguments by value
needless_pass_by_value = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
