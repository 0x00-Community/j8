[package]
# published as j8dune (the name dune is taken on crates.io); the library and the executables keep the name dune / dunx
name = "j8dune"
description = "dune and dunx: a JavaScript runtime on j8 with a Node-compatible layer and a Web-standard layer, and a runner for npm packages' executables"
readme = "README.md"
default-run = "dune"
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/0x00-Community/j8"
keywords = ["javascript", "runtime", "node", "npm", "j8"]
categories = ["command-line-utilities", "development-tools"]

# dune is a package of its own, built against the published j8 (not part of the j8 workspace)
[workspace]

[lib]
name = "dune"
path = "src/lib.rs"

[[bin]]
name = "dune"
path = "src/main.rs"

[[bin]]
name = "dunx"
path = "src/dunx.rs"

[dependencies]
j8 = { version = "0.4.0", features = ["runtime", "jit", "json"] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
nodejs-semver = { version = "7", features = ["serde"] }
flate2 = "1.1.11"
tar = "0.4.46"
sha2 = "0.10"
base64 = "0.22"
ureq = { version = "3", features = ["json"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
# When both branches have bodies, match reads better than if let ... else
single_match_else = "allow"
# Bound functions receive their converted arguments by value
needless_pass_by_value = "allow"
