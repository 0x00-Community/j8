name: j8 release

# Every new vX.Y.Z tag publishes the j8 workspace crates and then j8dune (dune/) to crates.io, nothing else: the
# GitHub release and npm belong to dune-release.yml. The tag must match the workspace version and dune/Cargo.toml.
# crates.io publishing uses the repository secret CRATE_TOKEN. Versions already on crates.io are skipped.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to (re)publish, such as v0.5.0"
        required: true

permissions:
  contents: read

concurrency:
  group: j8-release-${{ github.event.inputs.tag || github.ref_name }}

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  crates-io:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            dune
      - name: check version
        id: version
        run: |
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $TAG is not vX.Y.Z"
            exit 1
          fi
          version=${TAG#v}
          workspace=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "j8") | .version')
          dune=$(cargo metadata --no-deps --format-version 1 --manifest-path dune/Cargo.toml | jq -r '.packages[0].version')
          if [[ $version != "$workspace" || $version != "$dune" ]]; then
            echo "::error::tag $TAG is version $version but the workspace says $workspace and dune/Cargo.toml says $dune"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: crates not yet on crates.io
        id: pending
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          published() {
            local name=$1 path
            case ${#name} in
              1) path=1/$name ;;
              2) path=2/$name ;;
              3) path=3/${name:0:1}/$name ;;
              *) path=${name:0:2}/${name:2:2}/$name ;;
            esac
            curl -fsS "https://index.crates.io/$path" 2>/dev/null | jq -e --arg v "$VERSION" 'select(.vers == $v)' >/dev/null
          }
          exclude=() pending=0
          for name in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name'); do
            if published "$name"; then
              echo "$name@$VERSION is already published"
              exclude+=(--exclude "$name")
            else
              pending=1
            fi
          done
          echo "workspace=$pending" >>"$GITHUB_OUTPUT"
          echo "exclude=${exclude[*]}" >>"$GITHUB_OUTPUT"
          if published j8dune; then
            echo "j8dune@$VERSION is already published"
            echo "dune=0" >>"$GITHUB_OUTPUT"
          else
            echo "dune=1" >>"$GITHUB_OUTPUT"
          fi

      - name: publish workspace
        if: steps.pending.outputs.workspace == '1'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATE_TOKEN }}
        run: cargo publish --workspace --locked ${{ steps.pending.outputs.exclude }}

      # dune depends on the published j8: point its lock at the version just published
      - name: publish dune
        if: steps.pending.outputs.dune == '1'
        working-directory: dune
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATE_TOKEN }}
        run: |
          cargo update -p j8 --precise "$VERSION"
          cargo publish --allow-dirty
