[package]
name = "benchv8"
description = "Timing comparison of the same JS benchmarks on j8 and V8 (rusty_v8, with JIT / --jitless)"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Depends on rusty_v8 (the prebuilt static library is large), so it stays out of the root workspace
[workspace]

[dependencies]
v8 = "=152.2.0"
j8framework = { path = "../../crates/j8framework" }
j8platform = { path = "../../crates/j8platform" }
j8builtins = { path = "../../crates/j8builtins" }
j8executor = { path = "../../crates/j8executor" }

[profile.release]
debug = false
