[package]
name = "benchv8"
description = "Timing comparison of the same JS benchmarks on r8 and V8 (rusty_v8, with JIT / --jitless)"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Depends on rusty_v8 (the prebuilt static library is large), so it stays out of the root workspace
[workspace]

[dependencies]
v8 = "=152.2.0"
r8framework = { path = "../../crates/r8framework" }
r8platform = { path = "../../crates/r8platform" }
r8builtins = { path = "../../crates/r8builtins" }
r8executor = { path = "../../crates/r8executor" }

[profile.release]
debug = false
