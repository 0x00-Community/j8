[package]
name = "benchv8"
description = "同一组 JS 基准在 r8 与 V8（rusty_v8，带 JIT / --jitless）上的耗时对比"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# 依赖 rusty_v8（预编译静态库很大），不进根 workspace
[workspace]

[dependencies]
v8 = "=152.2.0"
r8framework = { path = "../../crates/r8framework" }
r8platform = { path = "../../crates/r8platform" }
r8builtins = { path = "../../crates/r8builtins" }
r8executor = { path = "../../crates/r8executor" }

[profile.release]
debug = false
