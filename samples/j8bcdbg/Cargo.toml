[package]
name = "j8bcdbg"
description = "j8bcdbg: j8 bytecode debugging CLI (compile JS to bytecode, read bytecode back)"
readme = "README.md"
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/0x00-Community/j8"
publish = false

# A sample is a package of its own, built against the published j8 (not part of the j8 workspace)
[workspace]

[[bin]]
name = "j8bcdbg"
path = "src/main.rs"

[dependencies]
j8 = { version = "0.4.0", default-features = false, features = ["compiler"] }
clap = { version = "4.6", features = ["derive"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
