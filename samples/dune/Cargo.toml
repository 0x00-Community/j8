[package]
name = "dune"
description = "dune: the j8 JavaScript runtime CLI (comparable to node / deno)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# the name is taken on crates.io
publish = false

[[bin]]
name = "dune"
path = "src/main.rs"

[dependencies]
j8framework.workspace = true
j8platform.workspace = true
j8builtins.workspace = true
j8executor.workspace = true
j8jit.workspace = true
clap.workspace = true
j8.workspace = true

# test262 conformance tests; the source lives in tests/ at the repo root (no separate crate)
[[test]]
name = "test262"
path = "../../tests/test262.rs"
harness = false

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[lints]
workspace = true
