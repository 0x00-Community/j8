[package]
name = "dune"
description = "dune: the r8 JavaScript runtime CLI (comparable to node / deno)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dune"
path = "src/main.rs"

[dependencies]
r8framework.workspace = true
r8platform.workspace = true
r8builtins.workspace = true
r8executor.workspace = true
r8jit.workspace = true
clap.workspace = true
r8.workspace = true

# test262 conformance tests; the source lives in tests/ at the repo root (no separate crate)
[[test]]
name = "test262"
path = "../../tests/test262.rs"
harness = false

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[lints]
workspace = true
