[package]
name = "dune"
description = "dune：r8 的 JavaScript 运行时命令行（对标 node / deno）"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dune"
path = "src/main.rs"

[dependencies]
r8framework.workspace = true
r8platform.workspace = true
r8builtins.workspace = true
r8executor.workspace = true
r8jit.workspace = true
clap.workspace = true
r8.workspace = true

# test262 一致性测试，源码在仓库根 tests/（不另开 crate）
[[test]]
name = "test262"
path = "../../tests/test262.rs"
harness = false

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[lints]
workspace = true
