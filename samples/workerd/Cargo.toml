[package]
name = "workerd"
description = "workerd: a minimal host that loads Cloudflare Workers (ES modules + Durable Objects) with j8"
readme = "README.md"
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/0x00-Community/j8"
# the name is taken on crates.io
publish = false

# A sample is a package of its own, built against the published j8 (not part of the j8 workspace)
[workspace]

[lib]
name = "workerd"
path = "src/lib.rs"

[[bin]]
name = "workerd"
path = "src/main.rs"

[dependencies]
# lockfree: Fifo / Oneshot for handing connections and messages to the event loop
j8 = { version = "0.3.0", features = ["lockfree"] }
clap = { version = "4.6", features = ["derive"] }
# Durable Object SQL storage (`ctx.storage.sql`)
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
# The WebSocket handshake's Sec-WebSocket-Accept
sha1_smol = "1"
# The network reactor (epoll on Linux): one thread for every socket of the process
mio = { version = "1", features = ["os-poll", "net"] }

[dev-dependencies]
# An independent WebSocket client for the chat test
tungstenite = "0.27"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
# When both branches have bodies, match reads better than if let ... else
single_match_else = "allow"
# Bound functions receive their converted arguments by value
needless_pass_by_value = "allow"
