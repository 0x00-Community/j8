[package]
name = "r8taskqueue"
description = "r8 任务队列：按轮推进的事件循环，每轮在 moremath 线程池上并行跑，只有可递归的任务能往里塞新任务"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
moremath = { workspace = true, features = ["alloc"] }

[dev-dependencies]
moremath = { workspace = true, features = ["std"] }

[lints]
workspace = true
