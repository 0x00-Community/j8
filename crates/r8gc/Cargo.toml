[package]
name = "r8gc"
description = "Generational, moving (compacting), parallel GC for Rust with a 'gc brand lifetime; collection runs on the moremath thread pool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
r8gc-macros = { version = "0.1.2", path = "macros" }
moremath = { workspace = true, features = ["alloc"] }

[dev-dependencies]
moremath = { workspace = true, features = ["std"] }

[features]
default = ["std"]
# Spin first while waiting, yield the CPU after a while (without std it can only spin, which slows parallel
# collection on a busy machine)
std = []
# Verify every edge in the old generation after each collection (for debugging; very slow)
verify = []

[lints]
workspace = true

