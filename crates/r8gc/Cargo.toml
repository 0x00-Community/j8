[package]
name = "r8gc"
description = "分代、可移动（压缩）、并行的 Rust GC，'gc 品牌生命周期，回收跑在 moremath 线程池上"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
r8gc-macros = { version = "0.1.2", path = "macros" }
moremath = { workspace = true, features = ["alloc"] }

[dev-dependencies]
moremath = { workspace = true, features = ["std"] }

[features]
default = ["std"]
# 等待时先自旋、久了让出 CPU（没有 std 只能一直自旋，机器忙时并行回收会被拖慢）
std = []
# 每次回收后把整个老年代的边校验一遍（调试用，很慢）
verify = []

[lints]
workspace = true

