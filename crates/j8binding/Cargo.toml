[package]
name = "j8binding"
description = "Rust ⇄ JS bindings for j8: type conversion, host objects, exporting Rust types as JS classes (procedural macros live in j8macros)"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
j8framework.workspace = true
j8lockfree.workspace = true
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }

[features]
# j8::Json<T>: Rust values crossing as JSON-shaped data through serde
json = ["dep:serde", "dep:serde_json"]

[lints]
workspace = true

